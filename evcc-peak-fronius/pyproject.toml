[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
asyncio_mode = "auto"
addopts = "--cov=custom_components.evcc_peak_fronius --cov-report=term-missing"

[tool.coverage.run]
source = ["../custom_components/evcc_peak_fronius"]

[tool.ruff]
src = [".."]  # custom_components/ lives at the repository root
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "E", "F", "I", "N", "PL", "RUF", "SIM", "UP", "W"]
ignore = ["D203", "D213", "PLR0913", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLR0917", "D102", "D103", "D104", "D205"]
