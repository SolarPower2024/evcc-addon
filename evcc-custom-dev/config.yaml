---
name: evcc custom development
version: 0.319.0-lm5-dev1
slug: evcc_custom_dev
description: Test version of evcc custom for new functions, started instead of evcc custom (own database)
url: https://github.com/SolarPower2024/evcc

# manual start: it uses the same port 7070 and the same devices as evcc custom,
# only one of the two may run (see DOCS.md)
boot: manual
startup: application
init: false
# evcc hands the battery back to Home Assistant when it stops (peak shaving);
# the default 10 s are not always enough for that
timeout: 30
watchdog: http://[HOST]:[PORT:7070]

panel_icon: mdi:test-tube
panel_admin: false
ingress: true
ingress_port: 7070
webui: http://[HOST]:[PORT:7070]/

host_network: true
legacy: true
uart: true
homeassistant_api: true
# restarts itself after taking over the data of evcc custom (Debug)
hassio_api: true

arch:
  - aarch64
  - amd64

map:
  - type: app_config
    read_only: False
  # the database of evcc custom for Debug → Testversion (take over, give back)
  - type: all_addon_configs
    read_only: False
  - type: homeassistant_config
    read_only: False

ports:
  4712/tcp: 4712
  5200/tcp: 5200
  5201/tcp: 5201
  5353/udp: 5353
  7050/tcp: 7050
  7090/udp: 7090
  8887/tcp: 8887
  8899/udp: 8899
  9522/udp: 9522

ports_description:
  4712/tcp: "EEBUS"
  5200/tcp: "Modbus Proxy"
  5201/tcp: "Modbus Proxy (multi port)"
  5353/udp: "Multicast DNS (mDNS)"
  7050/tcp: "evopt API"
  7090/udp: "Keba"
  8887/tcp: "OCPP web socket"
  8899/udp: "Modbus UDP"
  9522/udp: "SMA Speedwire Multicast"

# built by .github/workflows/custom-image.yml in the evcc fork.
# the image tag is taken from `version` above, so both must be bumped together.
image: ghcr.io/solarpower2024/evcc-custom

# where Debug → Testversion finds the database of evcc custom
environment:
  EVCC_DEVTRANSFER: /addon_configs/*_evcc_custom/evcc.db

options:
  sqlite_file: /data/evcc.db
  config_file: /config/evcc.yaml

schema:
  sqlite_file: str
  config_file: str?
  OPTIMIZER_URI: url?
  SEMP_BASE_URL: url?
  EVCC_REMOTE_ACCESS: str?
