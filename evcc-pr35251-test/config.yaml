---
name: PR35251 Test
version: "35251.1"
slug: evcc_pr35251_test
description: Test of evcc PR 35251 (grid import limited to the month's 15-min peak), separate from evcc custom
url: https://github.com/SolarPower2024/evcc-addon

# manual start: it uses the same port 7070 as evcc custom, see DOCS.md
boot: manual
startup: application
init: false
timeout: 30

panel_icon: mdi:test-tube
panel_admin: false
ingress: true
ingress_port: 7070
webui: http://[HOST]:[PORT:7070]/

host_network: true
legacy: true
uart: true
homeassistant_api: true

arch:
  - aarch64
  - amd64

map:
  - type: app_config
    read_only: False
  - type: homeassistant_config
    read_only: False

ports:
  7070/tcp: 7070

ports_description:
  7070/tcp: "evcc web ui"

# no image: Home Assistant builds the small Dockerfile next to this file
options:
  sqlite_file: /data/evcc.db
  config_file: /config/evcc.yaml

schema:
  sqlite_file: str
  config_file: str?
  OPTIMIZER_URI: url?
  SEMP_BASE_URL: url?
  EVCC_REMOTE_ACCESS: str?
