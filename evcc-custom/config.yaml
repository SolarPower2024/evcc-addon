---
name: evcc custom
version: 0.315.0-lm12
slug: evcc_custom
description: evcc with priority load management, battery participation and soc-based grid charging
url: https://github.com/SolarPower2024/evcc
stage: experimental

boot: auto
startup: application
init: false
watchdog: http://[HOST]:[PORT:7070]

panel_icon: mdi:ev-station
panel_admin: false
ingress: true
ingress_port: 7070
webui: http://[HOST]:[PORT:7070]/

host_network: true
legacy: true
uart: true
homeassistant_api: true

arch:
  - aarch64
  - amd64

map:
  - type: addon_config
    read_only: False
  - type: homeassistant_config
    read_only: False

ports:
  4712/tcp: 4712
  5200/tcp: 5200
  5201/tcp: 5201
  5353/udp: 5353
  7050/tcp: 7050
  7090/udp: 7090
  8887/tcp: 8887
  8899/udp: 8899
  9522/udp: 9522

ports_description:
  4712/tcp: "EEBUS"
  5200/tcp: "Modbus Proxy"
  5201/tcp: "Modbus Proxy (multi port)"
  5353/udp: "Multicast DNS (mDNS)"
  7050/tcp: "evopt API"
  7090/udp: "Keba"
  8887/tcp: "OCPP web socket"
  8899/udp: "Modbus UDP"
  9522/udp: "SMA Speedwire Multicast"

# built by .github/workflows/custom-image.yml in the evcc fork.
# the image tag is taken from `version` above, so both must be bumped together.
image: ghcr.io/solarpower2024/evcc-custom

options:
  sqlite_file: /data/evcc.db
  config_file: /config/evcc.yaml

schema:
  sqlite_file: str
  config_file: str?
  OPTIMIZER_URI: url?
  SEMP_BASE_URL: url?
  EVCC_REMOTE_ACCESS: str?
