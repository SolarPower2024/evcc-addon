name: Integration tests

on:
  push:
    paths:
      - "custom_components/**"
      - ".github/workflows/integration-tests.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - ".github/workflows/integration-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    name: evcc Peak Fronius
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r custom_components/evcc_peak_fronius/requirements-test.txt ruff

      - run: ruff check --config custom_components/evcc_peak_fronius/pyproject.toml custom_components

      # from the repository root: inside the folder select.py would shadow the standard library
      - run: pytest -q -p no:cacheprovider -c custom_components/evcc_peak_fronius/pyproject.toml
